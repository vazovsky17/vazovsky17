<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-labelledby="t d">
  <title id="t">Vazovsky — Mobile Developer</title>
  <desc id="d">Android and iOS developer. Kotlin, Jetpack Compose, Swift, SwiftUI. Building the Vazie ecosystem.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0F1E"/>
      <stop offset="0.55" stop-color="#131637"/>
      <stop offset="1" stop-color="#1A1440"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.78" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#8B7CF6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8B7CF6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EEF1FB"/>
      <stop offset="0.62" stop-color="#C9C3FB"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#8B7CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B7CF6" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#A78BFA"/>
    </pattern>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.45" stop-color="#3A3A3A"/>
      <stop offset="1" stop-color="#8A8A8A"/>
    </linearGradient>

    <mask id="dotmask">
      <rect x="0" y="0" width="1000" height="250" fill="url(#fade)"/>
    </mask>

    <clipPath id="card">
      <rect x="0" y="0" width="1000" height="250" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1000" height="250" fill="url(#bg)"/>
    <rect x="0" y="0" width="1000" height="250" fill="url(#dots)" mask="url(#dotmask)"/>
    <rect x="0" y="0" width="1000" height="250" fill="url(#glow)"/>
    <rect x="0" y="0" width="1000" height="3" fill="url(#rule)"/>

    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
      <text x="56" y="62" font-size="13" letter-spacing="3" fill="#7D84B4">app.vazovsky</text>

      <text x="54" y="128" font-size="56" font-weight="700" letter-spacing="1" fill="url(#name)">vazovsky</text>

      <text x="56" y="164" font-size="17" fill="#B3B9DD">Mobile Developer &#183; Android &amp; iOS &#183; building Vazie</text>

      <text x="56" y="202" font-size="15" fill="#7D84B4">
        <tspan fill="#A78BFA" font-weight="700">&gt;<animate attributeName="opacity" values="1;1;0.25;1" dur="1.6s" repeatCount="indefinite"/></tspan>
        <tspan dx="10">kotlin &#183; compose &#183; swift &#183; swiftui</tspan>
      </text>
    </g>

    <g fill="none" stroke-linecap="round">
      <rect x="796" y="40" width="82" height="170" rx="16" fill="#A78BFA" fill-opacity="0.05" stroke="#8B7CF6" stroke-opacity="0.6" stroke-width="2"/>
      <rect x="826" y="52" width="22" height="4" rx="2" fill="#8B7CF6" fill-opacity="0.7" stroke="none"/>
      <g stroke="#A78BFA" stroke-opacity="0.35" stroke-width="3">
        <line x1="814" y1="78" x2="860" y2="78"/>
        <line x1="814" y1="94" x2="848" y2="94"/>
        <line x1="814" y1="110" x2="856" y2="110"/>
      </g>

      <rect x="890" y="62" width="82" height="170" rx="16" fill="#C4B5FD" fill-opacity="0.04" stroke="#C4B5FD" stroke-opacity="0.38" stroke-width="2"/>
      <rect x="920" y="74" width="22" height="4" rx="2" fill="#C4B5FD" fill-opacity="0.5" stroke="none"/>
      <g stroke="#C4B5FD" stroke-opacity="0.24" stroke-width="3">
        <line x1="908" y1="100" x2="954" y2="100"/>
        <line x1="908" y1="116" x2="942" y2="116"/>
        <line x1="908" y1="132" x2="950" y2="132"/>
      </g>

      <path id="link" d="M878 150 C 900 150, 900 172, 922 172" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 5"/>
      <circle r="3.4" fill="#C4B5FD">
        <animateMotion dur="3.4s" repeatCount="indefinite" path="M878 150 C 900 150, 900 172, 922 172"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>

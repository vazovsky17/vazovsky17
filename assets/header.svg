<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Vazovsky — mobile systems</title>
  <desc id="desc">Native Android and iOS engineering, Kotlin Multiplatform and privacy by architecture.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B14"/>
      <stop offset="0.55" stop-color="#101525"/>
      <stop offset="1" stop-color="#171331"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5F8FF"/>
      <stop offset="0.58" stop-color="#D9D7FF"/>
      <stop offset="1" stop-color="#9B8CFF"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55E6C1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#55E6C1"/>
      <stop offset="1" stop-color="#9B8CFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0.82" cy="0.44" r="0.42">
      <stop offset="0" stop-color="#55E6C1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#55E6C1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0.58" cy="0.08" r="0.62">
      <stop offset="0" stop-color="#9B8CFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#9B8CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#7984B0" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#violetGlow)"/>
    <rect width="1200" height="360" fill="url(#cyanGlow)"/>
    <path d="M0 1.5H1200" stroke="url(#accentLine)" stroke-width="3"/>

    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
      <g transform="translate(64 54)">
        <circle cx="5" cy="5" r="5" fill="#55E6C1"/>
        <text x="21" y="10" font-size="13" letter-spacing="3.2" fill="#8D98BE">SYSTEM ONLINE / SARATOV UTC+4</text>
      </g>

      <text x="62" y="144" font-size="68" font-weight="700" letter-spacing="-2" fill="url(#titleGradient)">vazovsky<tspan fill="#55E6C1">_</tspan></text>
      <text x="66" y="186" font-size="19" letter-spacing="1.4" fill="#B8C1DF">MOBILE SYSTEMS ENGINEER</text>
      <text x="66" y="222" font-size="15" fill="#7783AA">native interfaces · shared cores · private data</text>

      <g transform="translate(66 264)" font-size="12" letter-spacing="1.2">
        <g>
          <rect width="116" height="32" rx="6" fill="#55E6C1" fill-opacity="0.08" stroke="#55E6C1" stroke-opacity="0.42"/>
          <text x="16" y="21" fill="#84F1D5">ANDROID</text>
        </g>
        <g transform="translate(128)">
          <rect width="90" height="32" rx="6" fill="#9B8CFF" fill-opacity="0.08" stroke="#9B8CFF" stroke-opacity="0.42"/>
          <text x="18" y="21" fill="#B8AEFF">iOS</text>
        </g>
        <g transform="translate(230)">
          <rect width="90" height="32" rx="6" fill="#9B8CFF" fill-opacity="0.08" stroke="#9B8CFF" stroke-opacity="0.42"/>
          <text x="22" y="21" fill="#B8AEFF">KMP</text>
        </g>
        <g transform="translate(332)">
          <rect width="204" height="32" rx="6" fill="#7FA7FF" fill-opacity="0.08" stroke="#7FA7FF" stroke-opacity="0.38"/>
          <text x="17" y="21" fill="#9BBCFF">LOCAL-FIRST / CI</text>
        </g>
      </g>
    </g>

    <g transform="translate(780 34)">
      <rect x="0" y="0" width="354" height="292" rx="18" fill="#090D18" fill-opacity="0.74" stroke="#7080AA" stroke-opacity="0.26"/>
      <path d="M18 50H336" stroke="#7080AA" stroke-opacity="0.2"/>
      <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
        <circle cx="23" cy="25" r="4" fill="#55E6C1"/>
        <text x="38" y="30" font-size="12" letter-spacing="2" fill="#AAB4D3">PERMAWARE / SCAN</text>
        <text x="289" y="30" font-size="11" fill="#55E6C1">LOCAL</text>

        <g transform="translate(91 72)">
          <circle cx="86" cy="72" r="67" fill="none" stroke="#27314C" stroke-width="10"/>
          <circle cx="86" cy="72" r="67" fill="none" stroke="#55E6C1" stroke-width="10" stroke-linecap="round" stroke-dasharray="342 421" transform="rotate(-90 86 72)" filter="url(#glow)"/>
          <circle cx="86" cy="72" r="48" fill="#55E6C1" fill-opacity="0.035" stroke="#55E6C1" stroke-opacity="0.14"/>
          <text x="86" y="66" text-anchor="middle" font-size="28" font-weight="700" fill="#F2F8FF">473</text>
          <text x="86" y="88" text-anchor="middle" font-size="10" letter-spacing="1.7" fill="#7F8BAF">PACKAGES</text>
        </g>

        <g transform="translate(24 242)" font-size="10">
          <text x="0" y="0" fill="#6F7A9C">NETWORK</text>
          <text x="0" y="21" fill="#55E6C1">NO PERMISSION</text>
          <text x="113" y="0" fill="#6F7A9C">SCAN</text>
          <text x="113" y="21" fill="#E0E5F4">~1.5 SEC</text>
          <text x="218" y="0" fill="#6F7A9C">TESTS</text>
          <text x="218" y="21" fill="#B8AEFF">194 PASS</text>
        </g>
      </g>

      <g fill="#55E6C1">
        <circle cx="44" cy="92" r="2" opacity="0.35"/>
        <circle cx="306" cy="86" r="2" opacity="0.55"/>
        <circle cx="321" cy="142" r="2" opacity="0.3"/>
        <circle cx="31" cy="184" r="2" opacity="0.48"/>
      </g>
      <path d="M44 92L112 111M306 86L242 110M321 142L246 143M31 184L114 159" stroke="#55E6C1" stroke-opacity="0.16" stroke-dasharray="3 5"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#465170">
      <text x="1138" y="346" text-anchor="end">BUILD 2026.09</text>
    </g>
  </g>
</svg>

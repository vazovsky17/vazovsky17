<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Vazovsky — Android developer и product builder</title>
  <desc id="desc">Kotlin, Jetpack Compose и Android SDK. Собственные продукты Vazie. Схематичный макет экрана Vazie VPN.</desc>

  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#00BBFF"/>
      <stop offset="0.55" stop-color="#4477FF"/>
      <stop offset="1" stop-color="#8B66FF"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00BBFF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#4477FF"/>
      <stop offset="0.75" stop-color="#8B66FF"/>
      <stop offset="1" stop-color="#8B66FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0.2" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#4477FF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#4477FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0.86" cy="0.55" r="0.42">
      <stop offset="0" stop-color="#8B66FF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8B66FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8891A6" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <rect width="1200" height="420" fill="#04070F"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <rect width="1200" height="420" fill="url(#blueGlow)"/>
    <rect width="1200" height="420" fill="url(#violetGlow)"/>
    <rect width="1200" height="3" fill="url(#topLine)"/>

    <!-- nav-style logo -->
    <text x="64" y="64" font-size="24" font-weight="700" letter-spacing="-0.5" fill="#F5F7FC">vazovsky<tspan fill="#5A8CFF">.pro()</tspan></text>

    <!-- availability pill -->
    <g transform="translate(64 92)">
      <rect width="270" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <circle cx="20" cy="17" r="4" fill="#5BE3A0"/>
      <text x="34" y="22" font-size="14" fill="#C9D1E6">Независимый Android-разработчик</text>
    </g>

    <text x="60" y="214" font-size="96" font-weight="800" letter-spacing="-4" fill="url(#name)">Vazovsky</text>
    <text x="64" y="262" font-size="29" font-weight="650" fill="#F5F7FC">Android developer и product builder</text>
    <text x="64" y="304" font-size="16" fill="#8891A6">Kotlin, Jetpack Compose и Android SDK — а ещё backend, инфраструктура, релиз.</text>

    <!-- stack chips -->
    <g transform="translate(64 330)" font-size="13" fill="#B9C2D8" text-anchor="middle">
      <g><rect width="72" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#8891A6" stroke-opacity="0.35"/><text x="36" y="20">Kotlin</text></g>
      <g transform="translate(82)"><rect width="132" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#8891A6" stroke-opacity="0.35"/><text x="66" y="20">Jetpack Compose</text></g>
      <g transform="translate(224)"><rect width="128" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#8891A6" stroke-opacity="0.35"/><text x="64" y="20">Coroutines / Flow</text></g>
      <g transform="translate(362)"><rect width="104" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#8891A6" stroke-opacity="0.35"/><text x="52" y="20">Spring Boot</text></g>
      <g transform="translate(476)"><rect width="74" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#8891A6" stroke-opacity="0.35"/><text x="37" y="20">Docker</text></g>
    </g>

    <!-- Vazie VPN mockup -->
    <g transform="translate(880 30)">
      <rect width="230" height="360" rx="34" fill="#080D1B" stroke="#8891A6" stroke-opacity="0.3"/>
      <text x="24" y="50" font-size="14" font-weight="650" fill="#F5F7FC">Vazie VPN</text>

      <rect x="16" y="66" width="198" height="106" rx="16" fill="#4CB0FF" fill-opacity="0.08" stroke="#4CB0FF" stroke-opacity="0.38"/>
      <circle cx="34" cy="90" r="4" fill="#5BE3A0"/>
      <text x="46" y="95" font-size="13" font-weight="600" fill="#F5F7FC">Подключено</text>
      <text x="32" y="116" font-size="11" fill="#8891A6">VLESS · Netherlands</text>
      <rect x="30" y="130" width="170" height="30" rx="15" fill="none" stroke="#4CB0FF" stroke-opacity="0.55"/>
      <text x="115" y="150" font-size="12" text-anchor="middle" fill="#8CCBFF">Отключиться</text>

      <text x="18" y="203" font-size="10" letter-spacing="1.4" fill="#8891A6">СЕРВЕРЫ VAZIE</text>

      <g font-size="12">
        <g transform="translate(16 214)">
          <rect width="198" height="38" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
          <rect x="8" y="8" width="22" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.08"/>
          <text x="19" y="23" font-size="9" text-anchor="middle" fill="#B9C2D8">NL</text>
          <text x="40" y="24" fill="#F5F7FC">Netherlands</text>
          <text x="188" y="24" font-size="10" text-anchor="end" fill="#5BE3A0">Подключено</text>
        </g>
        <g transform="translate(16 258)">
          <rect width="198" height="38" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
          <rect x="8" y="8" width="22" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.08"/>
          <text x="19" y="23" font-size="9" text-anchor="middle" fill="#B9C2D8">SE</text>
          <text x="40" y="24" fill="#F5F7FC">Sweden</text>
          <text x="188" y="24" font-size="10" text-anchor="end" fill="#8891A6">Готова</text>
        </g>
        <g transform="translate(16 302)">
          <rect width="198" height="38" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
          <rect x="8" y="8" width="22" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.08"/>
          <text x="19" y="23" font-size="9" text-anchor="middle" fill="#B9C2D8">US</text>
          <text x="40" y="24" fill="#F5F7FC">United States</text>
          <text x="188" y="24" font-size="10" text-anchor="end" fill="#8891A6">Готова</text>
        </g>
      </g>
    </g>
  </g>
</svg>
